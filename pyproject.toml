[project]
name = "career-copilot-mcp"
version = "0.2.0"
description = "Local-first, human-in-the-loop MCP server for a LinkedIn-centred job search. No scraping, no LinkedIn credentials."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "starlette>=1.0", "uvicorn>=0.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Read-only Gmail sync. Optional: everything else works without these.
gmail = [
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.scripts]
career-copilot = "career_copilot.cli:main"
career-copilot-mcp = "career_copilot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
